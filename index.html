<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push-up Counter</title>
<style>
  :root{
    --deep:#04232B;
    --deeper:#021419;
    --paper:#EAF2F0;
    --signal:#FFB020;
    --down:#3FD9A8;
    --dim:rgba(234,242,240,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--deeper);color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  #stage{position:fixed;inset:0;overflow:hidden;background:var(--deeper);
    display:flex;flex-direction:column;height:100vh;height:100dvh}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);filter:saturate(.5) contrast(1.05) brightness(.7)}
  #tint{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(120% 90% at 50% 42%, rgba(4,35,43,.15), rgba(2,20,25,.92) 100%)}

  /* signature: the frame closes in on you as you descend */
  #ring{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(255,176,32,.35);
    transition:box-shadow .08s linear}

  /* keep the UI above the video and its overlays */
  #top,#today,#count,#countlabel,#meter,#panel{position:relative;z-index:2}

  #top{flex:0 0 auto;padding:12px 18px;
    padding-top:calc(12px + env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .topLeft{display:flex;align-items:center;gap:10px;min-width:0}
  #menuBtn{flex:0 0 auto;width:34px;height:34px;padding:0;border:none;background:transparent;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}
  #menuBtn span{display:block;width:20px;height:2px;background:var(--paper);border-radius:2px}
  #workoutLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #state{color:var(--signal);flex:0 0 auto}

  #count{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;
    text-align:center;font-size:clamp(72px,20vh,220px);line-height:1;font-weight:900;
    letter-spacing:-.05em;font-variant-numeric:tabular-nums;
    text-shadow:0 6px 40px rgba(2,20,25,.9)}
  #count.pop{animation:pop .22s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
  #countlabel{flex:0 0 auto;
    text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  #today{flex:0 0 auto;margin-top:4px;
    text-align:center;font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--down);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0;transition:opacity .3s;
    text-shadow:0 2px 20px rgba(2,20,25,.9)}
  #today.on{opacity:1}

  #meter{flex:0 0 auto;margin:14px 18px 0;
    height:6px;background:rgba(234,242,240,.14);border-radius:99px;overflow:hidden}
  #fill{height:100%;width:0%;background:var(--signal);border-radius:99px;transition:width .06s linear}

  #panel{flex:0 0 auto;padding:14px 18px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(2,20,25,.96),rgba(2,20,25,0));
    display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px}
  button{flex:1;padding:15px 10px;border:1px solid rgba(234,242,240,.22);background:rgba(234,242,240,.06);
    color:var(--paper);border-radius:14px;font-size:14px;font-weight:600;letter-spacing:.01em;cursor:pointer}
  button:active{background:rgba(234,242,240,.16)}
  button:disabled{opacity:.35}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  button.primary{background:var(--signal);color:#04232B;border-color:var(--signal);font-weight:800}
  button.done{border-color:var(--down);color:var(--down)}
  .hint{font-size:12px;line-height:1.45;color:var(--dim);text-align:center;padding:0 4px}

  #sensRow{display:flex;flex-direction:column;gap:8px}
  .drawerSection{display:flex;flex-direction:column;gap:12px}
  .drawerDivider{height:1px;background:rgba(234,242,240,.16);margin:2px 0}
  #readout{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #sensLabel{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
  #sensLabel span{letter-spacing:.08em;text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #sens{width:100%;accent-color:var(--signal);height:28px}

  #countdown{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(2,20,25,.82)}
  #countdown.on{display:grid}
  #cdnum{font-size:34vh;font-weight:900;color:var(--signal);line-height:1}
  #cdtxt{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-size:15px;color:var(--paper)}

  #drawerBackdrop{position:fixed;inset:0;background:rgba(2,20,25,.6);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
  #drawerBackdrop.on{opacity:1;pointer-events:auto}

  #drawer{position:fixed;top:0;left:0;bottom:0;width:min(78vw,320px);
    background:var(--deep);border-right:1px solid rgba(234,242,240,.14);
    transform:translateX(-100%);transition:transform .25s ease;z-index:5;
    padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
    display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  #drawer.on{transform:translateX(0)}
  #drawerHead{display:flex;justify-content:space-between;align-items:center}
  #addWorkoutBtn{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:8px;
    border:1px solid rgba(234,242,240,.22);background:rgba(234,242,240,.06);
    color:var(--signal);font-size:18px;font-weight:800;line-height:1}
  #workoutList{display:flex;flex-direction:column;gap:8px}
  .workoutItem{width:100%;flex:none;padding:12px;text-align:left;
    border:1px solid rgba(234,242,240,.14);border-radius:12px;
    background:rgba(234,242,240,.04);font-size:14px;font-weight:600}
  .workoutItem.active{border-color:var(--signal);color:var(--signal)}
  .workoutEmpty{font-size:12px;color:var(--dim);text-align:center;padding:16px 0}
  #addWorkoutForm{display:none;flex-direction:column;gap:8px}
  #newWorkoutName{padding:12px;border-radius:10px;border:1px solid rgba(234,242,240,.22);
    background:rgba(234,242,240,.06);color:var(--paper);font-size:14px;width:100%}
  #addWorkoutForm .row button{padding:10px}

  @media (prefers-reduced-motion:reduce){#count.pop{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div id="tint"></div>
  <div id="ring"></div>

  <div id="top">
    <div class="topLeft">
      <button id="menuBtn" aria-label="Workouts"><span></span><span></span><span></span></button>
      <span class="eyebrow" id="workoutLabel">Push-ups</span>
    </div>
    <span class="eyebrow" id="state">Camera off</span>
  </div>

  <div id="count">0</div>
  <div id="countlabel">reps</div>
  <div id="today">Today 0</div>

  <div id="meter"><div id="fill"></div></div>

  <div id="panel">
    <div class="row" id="row1">
      <button id="start" class="primary">Start camera</button>
    </div>
    <div class="row" id="row2" style="display:none">
      <button id="calUp">Capture up position</button>
      <button id="calDown">Capture down position</button>
    </div>
    <div class="row" id="row3" style="display:none">
      <button id="reset">Reset count</button>
      <button id="save" style="display:none">Save set</button>
    </div>
    <p class="hint" id="hint">Put the phone on the floor under your chest, screen up.</p>
  </div>

  <div id="countdown"><div id="cdnum">3</div><div id="cdtxt">Hold still</div></div>
</div>

<div id="drawerBackdrop"></div>
<div id="drawer">
  <div class="drawerSection">
    <span class="eyebrow">Settings</span>
    <div id="sensRow">
      <label id="sensLabel">
        <span>Sensitivity</span>
        <input id="sens" type="range" min="0" max="100" value="70">
      </label>
      <div id="readout">depth 0 · trigger 49</div>
    </div>
  </div>

  <div class="drawerDivider"></div>

  <div id="drawerHead">
    <span class="eyebrow">Workouts</span>
    <button id="addWorkoutBtn" aria-label="Add workout">+</button>
  </div>
  <div id="workoutList"></div>
  <div id="addWorkoutForm">
    <input id="newWorkoutName" type="text" placeholder="Workout name" maxlength="40">
    <div class="row">
      <button id="confirmAddWorkout" class="primary">Add</button>
      <button id="cancelAddWorkout">Cancel</button>
    </div>
  </div>
</div>

<canvas id="c" width="16" height="12" style="display:none"></canvas>

<script>
const W=16,H=12,N=W*H;
const v=document.getElementById('v'), cv=document.getElementById('c'), ctx=cv.getContext('2d',{willReadFrequently:true});
const elCount=document.getElementById('count'), elState=document.getElementById('state'),
      elFill=document.getElementById('fill'), elRing=document.getElementById('ring'), elHint=document.getElementById('hint');
const btnStart=document.getElementById('start'), btnUp=document.getElementById('calUp'),
      btnDown=document.getElementById('calDown'), btnReset=document.getElementById('reset');
const cd=document.getElementById('countdown'), cdnum=document.getElementById('cdnum'), cdtxt=document.getElementById('cdtxt');
const elReadout=document.getElementById('readout'), elSens=document.getElementById('sens');

// slider right = more sensitive = lower trigger (0.75 down to 0.38)
const sensToArm = val => .75 - (val/100)*.37;
try{
  const saved = localStorage.getItem('sensitivity');
  if(saved !== null){ elSens.value = saved; armAt = sensToArm(saved); }
}catch(e){}
elSens.addEventListener('input', () => {
  armAt = sensToArm(elSens.value);
  try{ localStorage.setItem('sensitivity', elSens.value); }catch(e){}
});

let tplUp=null, tplDown=null, count=0, phase='up', lastFlip=0, busy=false, running=false;
let armAt=.49;          // sensitivity 70 on the 0-100 scale
let peak=0, lastPeak=0; // deepest point of the current/most recent rep
const RELEASE=.10, DEBOUNCE=300;

// --- tiny normalized thumbnail of the CENTER of the frame ---
// cropping out the edges stops static background from drowning out your face
const CROP=.6;
function grab(){
  if(v.readyState<2) return null;
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh) return null;
  const sw=vw*CROP, sh=vh*CROP;
  ctx.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data, a=new Float32Array(N);
  let m=0;
  for(let i=0;i<N;i++){const p=i*4; a[i]=(d[p]*.299+d[p+1]*.587+d[p+2]*.114); m+=a[i];}
  m/=N;
  let s=0; for(let i=0;i<N;i++){a[i]-=m; s+=a[i]*a[i];}
  s=Math.sqrt(s/N)||1;
  for(let i=0;i<N;i++) a[i]/=s;
  return a;
}
function dist(a,b){let s=0;for(let i=0;i<N;i++){const d=a[i]-b[i];s+=d*d;}return s/N;}

let audio;
function beep(f,ms){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();
    o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audio.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+ms/1000);
    o.start(); o.stop(audio.currentTime+ms/1000);
  }catch(e){}
}

btnStart.onclick=async()=>{
  btnStart.disabled=true; elState.textContent='Starting…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}},audio:false});
    v.srcObject=stream; await v.play();
    running=true;
    document.getElementById('row1').style.display='none';
    document.getElementById('row2').style.display='flex';
    document.getElementById('row3').style.display='flex';
    elState.textContent='Needs calibration';
    elHint.textContent='Step 1: hold the top of a push-up and tap “Capture up position”.';
    beep(660,90);
    loop();
  }catch(e){
    btnStart.disabled=false; elState.textContent='No camera';
    elHint.textContent='Camera access was blocked. Allow it in your browser settings, then tap Start camera again.';
  }
};

function countdownCapture(which){
  if(busy) return; busy=true;
  cd.classList.add('on');
  cdtxt.textContent = which==='up' ? 'Get to the top and hold' : 'Get your face 3 inches from the camera and hold';
  let n=3; cdnum.textContent=n; beep(520,80);
  const t=setInterval(()=>{
    n--;
    if(n>0){cdnum.textContent=n; beep(520,80);}
    else{
      clearInterval(t); cd.classList.remove('on'); beep(880,160);
      const f=grab();
      if(f){
        if(which==='up'){tplUp=f; btnUp.classList.add('done'); btnUp.textContent='Up position set';}
        else{tplDown=f; btnDown.classList.add('done'); btnDown.textContent='Down position set';}
      }
      if(tplUp&&tplDown){
        elState.textContent='Counting'; phase='up';
        elHint.textContent='Go. A rep lands when you come back up.';
      }else{
        elHint.textContent = tplUp ? 'Step 2: tap “Capture down position”, then get your face right up to the camera.'
                                   : 'Step 1: hold the top of a push-up and tap “Capture up position”.';
      }
      busy=false;
    }
  },1000);
}
btnUp.onclick=()=>countdownCapture('up');
btnDown.onclick=()=>countdownCapture('down');
btnReset.onclick=()=>{count=0; elCount.textContent='0'; phase='up';};

// hooks for the Firebase module below
window.getCount=()=>count;
window.zeroCount=()=>{count=0; elCount.textContent='0'; phase='up';};

function loop(){
  if(!running) return;
  requestAnimationFrame(loop);
  if(busy) return;
  const f=grab(); if(!f) return;

  let score=0;
  if(tplUp&&tplDown){
    const du=dist(f,tplUp), dd=dist(f,tplDown);
    score=du/(du+dd||1);
    const now=performance.now();

    if(phase==='up'){
      // start of a rep: got deep enough to arm
      if(score>armAt && now-lastFlip>DEBOUNCE){ phase='down'; peak=score; lastFlip=now; beep(340,60); }
    }else{
      if(score>peak) peak=score;          // track the deepest point YOU reached
      // rep ends when you've come back up meaningfully from that point
      if(score < peak-RELEASE && score < armAt && now-lastFlip>DEBOUNCE){
        phase='up'; lastFlip=now; lastPeak=peak; count++;
        elCount.textContent=count;
        elCount.classList.remove('pop'); void elCount.offsetWidth; elCount.classList.add('pop');
        beep(900,130);
      }
    }
  }
  const pct=Math.max(0,Math.min(1,score));
  elFill.style.width=(pct*100).toFixed(1)+'%';
  elFill.style.background = phase==='down' ? 'var(--down)' : 'var(--signal)';
  const w=4+pct*34, col = phase==='down' ? '63,217,168' : '255,176,32';
  elRing.style.boxShadow=`inset 0 0 0 ${w.toFixed(1)}px rgba(${col},${(.25+pct*.45).toFixed(2)})`;
  if(elReadout) elReadout.textContent =
    `depth ${Math.round(pct*100)}  ·  trigger ${Math.round(armAt*100)}` +
    (lastPeak ? `  ·  last rep ${Math.round(lastPeak*100)}` : '');
}
</script>

<script type="module">
/* ─────────────────────────────────────────────────────────────
   FIREBASE — paste your own config from
   Firebase console → Project settings → Your apps → Web app.
   Leave it as-is and the app just runs without saving.
   Also enable: Authentication → Sign-in method → Anonymous.
   ───────────────────────────────────────────────────────────── */
const firebaseConfig = {
  apiKey: "AIzaSyATaigvrEpTIa-G0RN_dXO0-Heh2qpGsos",
  authDomain: "pushup-counter-c393a.firebaseapp.com",
  projectId: "pushup-counter-c393a",
  storageBucket: "pushup-counter-c393a.firebasestorage.app",
  messagingSenderId: "1024118983641",
  appId: "1:1024118983641:web:c6d0e8f9abe3261b8da7c8"
};

const elToday = document.getElementById('today');
const btnSave = document.getElementById('save');

if (firebaseConfig.apiKey === "PASTE_ME") {
  console.log("Firebase not configured — saving is off.");
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, signInAnonymously, onAuthStateChanged } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const { getFirestore, doc, getDoc, setDoc, increment, collection, getDocs } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const dayKey = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
  let uid = null, todayReps = 0;
  let workouts = [], activeWorkoutId = null;

  const todayRef = () => doc(db, 'users', uid, 'workouts', activeWorkoutId, 'sessions', dayKey());
  const paintToday = () => { elToday.textContent = `Today ${todayReps}`; elToday.classList.add('on'); };

  async function loadToday(){
    if(!activeWorkoutId) return;
    const forId = activeWorkoutId;
    try{
      const snap = await getDoc(todayRef());
      if(forId !== activeWorkoutId) return; // switched again while this was in flight
      todayReps = snap.exists() ? (snap.data().reps || 0) : 0;
      paintToday();
    }catch(e){ console.warn('Read failed', e); }
  }

  // ── workout drawer ──────────────────────────────────────────
  const menuBtn = document.getElementById('menuBtn');
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const workoutListEl = document.getElementById('workoutList');
  const workoutLabel = document.getElementById('workoutLabel');
  const addWorkoutBtn = document.getElementById('addWorkoutBtn');
  const addForm = document.getElementById('addWorkoutForm');
  const newNameInput = document.getElementById('newWorkoutName');

  function openDrawer(){ drawer.classList.add('on'); backdrop.classList.add('on'); }
  function closeDrawer(){ drawer.classList.remove('on'); backdrop.classList.remove('on'); addForm.style.display='none'; }
  menuBtn.onclick = openDrawer;
  backdrop.onclick = closeDrawer;

  function renderWorkouts(){
    workoutListEl.innerHTML = '';
    if(workouts.length === 0){
      workoutListEl.innerHTML = '<div class="workoutEmpty">No workouts yet — tap + to add one.</div>';
      return;
    }
    workouts.forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'workoutItem' + (w.id === activeWorkoutId ? ' active' : '');
      btn.textContent = w.name;
      btn.onclick = () => selectWorkout(w.id);
      workoutListEl.appendChild(btn);
    });
  }

  function selectWorkout(id){
    if(id === activeWorkoutId){ closeDrawer(); return; }
    activeWorkoutId = id;
    const w = workouts.find(x => x.id === id);
    workoutLabel.textContent = w ? w.name : '';
    try{ localStorage.setItem('activeWorkoutId', id); }catch(e){}
    // unsaved reps belong to the workout you were in, not this one
    window.zeroCount();
    todayReps = 0; paintToday();
    closeDrawer();
    renderWorkouts();
    loadToday();
  }

  addWorkoutBtn.onclick = () => { addForm.style.display='flex'; newNameInput.value=''; newNameInput.focus(); };
  document.getElementById('cancelAddWorkout').onclick = () => { addForm.style.display='none'; };
  document.getElementById('confirmAddWorkout').onclick = addWorkout;
  newNameInput.addEventListener('keydown', e => { if(e.key === 'Enter') addWorkout(); });

  function addWorkout(){
    const name = newNameInput.value.trim();
    if(!name) return;
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    workouts.push({ id, name });
    addForm.style.display = 'none';
    selectWorkout(id);
    if(uid){
      setDoc(doc(db,'users',uid,'workouts',id), { name, createdAt: Date.now() })
        .catch(e => console.warn('Workout save failed', e));
    }
  }

  async function loadWorkouts(){
    try{
      const snap = await getDocs(collection(db,'users',uid,'workouts'));
      workouts = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
    }catch(e){ console.warn('Workout list load failed', e); }

    if(workouts.length === 0){
      // seed a default so the app is usable before you've made any workouts
      const id = 'pushups';
      workouts = [{ id, name: 'Push-ups' }];
      setDoc(doc(db,'users',uid,'workouts',id), { name:'Push-ups', createdAt: Date.now() })
        .catch(e => console.warn('Default workout save failed', e));
    }

    const saved = (() => { try{ return localStorage.getItem('activeWorkoutId'); }catch(e){ return null; } })();
    activeWorkoutId = workouts.find(w => w.id === saved) ? saved : workouts[0].id;
    workoutLabel.textContent = workouts.find(w => w.id === activeWorkoutId).name;
    renderWorkouts();
    loadToday();
  }
  // ─────────────────────────────────────────────────────────────

  signInAnonymously(auth).catch(e => console.warn('Sign-in failed', e));
  onAuthStateChanged(auth, user => {
    if(!user) return;
    uid = user.uid;
    btnSave.style.display = '';
    loadWorkouts();
  });

  btnSave.onclick = () => {
    const reps = window.getCount();
    if(!uid || reps === 0) return;

    // screen updates now; the write finishes in the background
    todayReps += reps;
    paintToday();
    window.zeroCount();
    btnSave.textContent = 'Saved';
    setTimeout(() => { btnSave.textContent = 'Save set'; }, 1200);

    setDoc(todayRef(), { reps: increment(reps), updated: Date.now() }, { merge: true })
      .catch(e => {
        console.warn('Save failed', e);
        todayReps -= reps;
        paintToday();
        btnSave.textContent = 'Save failed';
      });
  };
}
</script>
</body>
</html>
