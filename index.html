<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push-up Counter</title>
<style>
  :root{
    --deep:#04232B;
    --deeper:#021419;
    --paper:#EAF2F0;
    --signal:#FFB020;
    --down:#3FD9A8;
    --dim:rgba(234,242,240,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--deeper);color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  #stage{position:fixed;inset:0;overflow:hidden;background:var(--deeper);
    display:flex;flex-direction:column;height:100vh;height:100dvh}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);filter:saturate(.5) contrast(1.05) brightness(.7)}
  #tint{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(120% 90% at 50% 42%, rgba(4,35,43,.15), rgba(2,20,25,.92) 100%)}

  /* signature: the frame closes in on you as you descend */
  #ring{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(255,176,32,.35);
    transition:box-shadow .08s linear}

  /* keep the UI above the video and its overlays */
  #top,#today,#count,#countlabel,#meter,#panel{position:relative;z-index:2}

  #top{flex:0 0 auto;padding:12px 18px;
    padding-top:calc(12px + env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .topLeft{display:flex;align-items:center;gap:10px;min-width:0}
  #menuBtn{flex:0 0 auto;width:34px;height:34px;padding:0;border:none;background:transparent;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}
  #menuBtn span{display:block;width:20px;height:2px;background:var(--paper);border-radius:2px}
  #workoutLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #state{color:var(--signal);flex:0 0 auto}

  #count{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;
    text-align:center;font-size:clamp(72px,20vh,220px);line-height:1;font-weight:900;
    letter-spacing:-.05em;font-variant-numeric:tabular-nums;
    text-shadow:0 6px 40px rgba(2,20,25,.9)}
  #count.pop{animation:pop .22s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
  #countlabel{flex:0 0 auto;
    text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  #today{flex:0 0 auto;margin-top:4px;
    text-align:center;font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--down);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0;transition:opacity .3s;
    text-shadow:0 2px 20px rgba(2,20,25,.9)}
  #today.on{opacity:1}

  #meter{flex:0 0 auto;margin:14px 18px 0;
    height:6px;background:rgba(234,242,240,.14);border-radius:99px;overflow:hidden}
  #fill{height:100%;width:0%;background:var(--signal);border-radius:99px;transition:width .06s linear}

  #panel{flex:0 0 auto;padding:14px 18px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(2,20,25,.96),rgba(2,20,25,0));
    display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px}
  button{flex:1;padding:15px 10px;border:1px solid rgba(234,242,240,.22);background:rgba(234,242,240,.06);
    color:var(--paper);border-radius:14px;font-size:14px;font-weight:600;letter-spacing:.01em;cursor:pointer}
  button:active{background:rgba(234,242,240,.16)}
  button:disabled{opacity:.35}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  button.primary{background:var(--signal);color:#04232B;border-color:var(--signal);font-weight:800}
  button.done{border-color:var(--down);color:var(--down)}
  .hint{font-size:12px;line-height:1.45;color:var(--dim);text-align:center;padding:0 4px}

  #sensRow{display:flex;flex-direction:column;gap:8px}
  .drawerSection{display:flex;flex-direction:column;gap:12px}
  .drawerDivider{height:1px;background:rgba(234,242,240,.16);margin:2px 0}
  #readout{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #sensLabel{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
  #sensLabel span{letter-spacing:.08em;text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #sens{width:100%;accent-color:var(--signal);height:28px}

  #resetWrap{position:relative;flex:1;display:flex}
  #resetWrap button{flex:1}
  #resetMenu{display:none;position:absolute;bottom:calc(100% + 8px);left:0;right:0;z-index:6;
    background:var(--deep);border:1px solid rgba(234,242,240,.22);border-radius:14px;
    overflow:hidden;box-shadow:0 10px 30px rgba(2,20,25,.7);
    flex-direction:column}
  #resetMenu.on{display:flex}
  #resetMenu button{border:none;border-radius:0;background:transparent;text-align:left;
    padding:13px 14px;font-size:13px}
  #resetMenu button:not(:last-child){border-bottom:1px solid rgba(234,242,240,.12)}
  #resetMenu button:disabled{opacity:.35}

  .typeBtn{padding:10px;font-size:12px;letter-spacing:.04em}
  .typeBtn.on{border-color:var(--signal);color:var(--signal);background:rgba(255,176,32,.12)}
  .workoutTag{font-size:10px;letter-spacing:.14em;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:block;margin-top:3px}
  #count.timer{font-size:clamp(56px,14vh,150px);letter-spacing:-.02em}

  #poseDebug{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;
    transform:scaleX(-1)}

  #countdown{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(2,20,25,.82)}
  #countdown.on{display:grid}
  #cdnum{font-size:34vh;font-weight:900;color:var(--signal);line-height:1}
  #cdtxt{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-size:15px;color:var(--paper)}

  #drawerBackdrop{position:fixed;inset:0;background:rgba(2,20,25,.6);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
  #drawerBackdrop.on{opacity:1;pointer-events:auto}

  #drawer{position:fixed;top:0;left:0;bottom:0;width:min(78vw,320px);
    background:var(--deep);border-right:1px solid rgba(234,242,240,.14);
    transform:translateX(-100%);transition:transform .25s ease;z-index:5;
    padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
    display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  #drawer.on{transform:translateX(0)}
  #drawerHead{display:flex;justify-content:space-between;align-items:center}
  #addWorkoutBtn{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:8px;
    border:1px solid rgba(234,242,240,.22);background:rgba(234,242,240,.06);
    color:var(--signal);font-size:18px;font-weight:800;line-height:1}
  #workoutList{display:flex;flex-direction:column;gap:8px}
  .workoutItem{width:100%;flex:none;padding:12px;text-align:left;
    border:1px solid rgba(234,242,240,.14);border-radius:12px;
    background:rgba(234,242,240,.04);font-size:14px;font-weight:600}
  .workoutItem.active{border-color:var(--signal);color:var(--signal)}
  .workoutEmpty{font-size:12px;color:var(--dim);text-align:center;padding:16px 0}
  #addWorkoutForm{display:none;flex-direction:column;gap:8px}
  #newWorkoutName{padding:12px;border-radius:10px;border:1px solid rgba(234,242,240,.22);
    background:rgba(234,242,240,.06);color:var(--paper);font-size:14px;width:100%}
  #addWorkoutForm .row button{padding:10px}

  @media (prefers-reduced-motion:reduce){#count.pop{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div id="tint"></div>
  <div id="ring"></div>

  <div id="top">
    <div class="topLeft">
      <button id="menuBtn" aria-label="Workouts"><span></span><span></span><span></span></button>
      <span class="eyebrow" id="workoutLabel">Push-ups</span>
    </div>
    <span class="eyebrow" id="state">Camera off</span>
  </div>

  <div id="count">0</div>
  <div id="countlabel">reps</div>
  <div id="today">Today 0</div>

  <div id="meter"><div id="fill"></div></div>

  <div id="panel">
    <div class="row" id="row1">
      <button id="start" class="primary">Start camera</button>
    </div>
    <div class="row" id="row2" style="display:none">
      <button id="calUp">Capture up position</button>
      <button id="calDown">Capture down position</button>
    </div>
    <div class="row" id="row3" style="display:none">
      <div id="resetWrap">
        <button id="resetMenuBtn">Reset</button>
        <div id="resetMenu">
          <button id="resetUpOpt">Reset up position</button>
          <button id="resetDownOpt">Reset down position</button>
          <button id="resetCountOpt">Reset count</button>
        </div>
      </div>
      <button id="resetAll">Reset all</button>
      <button id="pause">Pause</button>
    </div>
    <div class="row" id="rowPaused" style="display:none">
      <button id="save" style="display:none">Save set</button>
      <button id="unpause" class="primary">Unpause</button>
    </div>
    <div class="row" id="rowHold" style="display:none">
      <button id="holdSet">Set position</button>
      <button id="holdStart" class="primary">Start</button>
    </div>
    <p class="hint" id="hint">Put the phone on the floor under your chest, screen up.</p>
  </div>

  <div id="countdown"><div id="cdnum">3</div><div id="cdtxt">Hold still</div></div>
  <canvas id="poseDebug"></canvas>
</div>

<div id="drawerBackdrop"></div>
<div id="drawer">
  <div class="drawerSection">
    <span class="eyebrow">Settings</span>
    <div id="sensRow">
      <label id="sensLabel">
        <span id="sensValue">Sensitivity 54</span>
        <input id="sens" type="range" min="0" max="100" value="54">
      </label>
      <div id="readout">depth 0 · trigger 55</div>
    </div>
  </div>

  <div class="drawerDivider"></div>

  <div id="drawerHead">
    <span class="eyebrow">Workouts</span>
    <button id="addWorkoutBtn" aria-label="Add workout">+</button>
  </div>
  <div id="workoutList"></div>
  <div id="addWorkoutForm">
    <input id="newWorkoutName" type="text" placeholder="Workout name" maxlength="40">
    <div class="row" id="typeChoice">
      <button id="typeReps" class="typeBtn on">Reps</button>
      <button id="typeHold" class="typeBtn">Hold position</button>
    </div>
    <div class="row">
      <button id="confirmAddWorkout" class="primary">Add</button>
      <button id="cancelAddWorkout">Cancel</button>
    </div>
  </div>
</div>

<canvas id="c" width="22" height="18" style="display:none"></canvas>

<script>
const GW=22,GH=18;            // grabbed a bit larger than the compared window...
const W=16,H=12,N=W*H;        // ...so the window can slide inside it
const SHIFT=3;                // how far the match may slide to follow your head
const v=document.getElementById('v'), cv=document.getElementById('c'), ctx=cv.getContext('2d',{willReadFrequently:true});
const elCount=document.getElementById('count'), elState=document.getElementById('state'),
      elFill=document.getElementById('fill'), elRing=document.getElementById('ring'), elHint=document.getElementById('hint');
const btnStart=document.getElementById('start'), btnUp=document.getElementById('calUp'),
      btnDown=document.getElementById('calDown');
const cd=document.getElementById('countdown'), cdnum=document.getElementById('cdnum'), cdtxt=document.getElementById('cdtxt');
const elReadout=document.getElementById('readout'), elSens=document.getElementById('sens'),
      elSensValue=document.getElementById('sensValue');
const elCountLabel=document.getElementById('countlabel');
const row2=document.getElementById('row2'), row3=document.getElementById('row3'),
      rowPaused=document.getElementById('rowPaused');

let tplUps=[], tplDowns=[], downCaptures=0, count=0, phase='up', lastFlip=0, busy=false, running=false;
const MAX_DOWNS=4;              // separate down positions (each stores several frames)
const BURST_N=8, BURST_MS=90, KEEP=3;   // frames sampled per capture, and how many survive
let armAt=.55;          // sensitivity 54 on the 0-100 scale
let peak=0, lastPeak=0; // deepest point of the current/most recent rep
let lastScore=0, hold=0, paused=false;
const RELEASE=.10, DEBOUNCE=300, HOLD=3;

// ── hold-position (plank) mode ──
let mode='reps';
let tplHold=[], holdBase=0, holdRef=0, graceSum=0, graceN=0, holdRunning=false, holdT0=0, holdBreak=0, lastDrift=0;
const BREAK_FRAMES=12;  // ~0.2-0.4s of broken form before the clock stops
const HARD_FRAMES=4;    // obvious collapse stops almost immediately
const GRACE_MS=1500;    // settle time — also where the real drift baseline is measured

// body tracking (MoveNet) for holds — sees joints, not pixels
let poseDetector=null, poseLoading=false, poseRef=null, poseScale=1, estimating=false, poseDrift=null;

// slider right = more sensitive = lower trigger (0.75 down to 0.38)
const sensToArm = val => .75 - (val/100)*.37;

function paintReadout(){
  elSensValue.textContent = `Sensitivity ${elSens.value}`;
  elReadout.textContent =
    `depth ${Math.round(lastScore*100)}  ·  trigger ${Math.round(armAt*100)}` +
    (lastPeak ? `  ·  last rep ${Math.round(lastPeak*100)}` : '');
}

try{
  const saved = localStorage.getItem('sensitivity');
  if(saved !== null){ elSens.value = saved; armAt = sensToArm(saved); }
}catch(e){}
paintReadout();

elSens.addEventListener('input', () => {
  armAt = sensToArm(elSens.value);
  paintReadout();
  try{ localStorage.setItem('sensitivity', elSens.value); }catch(e){}
});

// --- sample the frame, a bit larger than the window we compare ---
// reps: crop to the center, where your face moves. holds: use nearly the whole
// frame, because what fails in a plank (hips, knees) is out at the edges.
const CROP=.6;
function cropNow(){ return mode==='hold' ? .98 : CROP; }
function grab(){
  if(v.readyState<2) return null;
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh) return null;
  const c=cropNow(), sw=vw*c, sh=vh*c;
  ctx.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,GW,GH);
  const d=ctx.getImageData(0,0,GW,GH).data, g=new Float32Array(GW*GH);
  for(let i=0;i<GW*GH;i++){const p=i*4; g[i]=d[p]*.299+d[p+1]*.587+d[p+2]*.114;}
  return g;
}

// pull a W×H window at an offset, brightness-normalized so lighting doesn't matter
function windowAt(g,dx,dy){
  const ox=((GW-W)>>1)+dx, oy=((GH-H)>>1)+dy, a=new Float32Array(N);
  let m=0;
  for(let y=0;y<H;y++){
    const row=(oy+y)*GW+ox;
    for(let x=0;x<W;x++){ const val=g[row+x]; a[y*W+x]=val; m+=val; }
  }
  m/=N;
  let s=0; for(let i=0;i<N;i++){a[i]-=m; s+=a[i]*a[i];}
  s=Math.sqrt(s/N)||1;
  for(let i=0;i<N;i++) a[i]/=s;
  return a;
}

// best match over every allowed shift — head drift stops mattering, distance still does
// each side = the CLOSEST of its stored frames (burst variations, left leg vs right leg, ...)
function bestPair(g,tUps,tDowns){
  let du=Infinity, dd=Infinity;
  for(let dy=-SHIFT;dy<=SHIFT;dy++){
    for(let dx=-SHIFT;dx<=SHIFT;dx++){
      const w=windowAt(g,dx,dy);
      for(const t of tUps){   const a=dist(w,t); if(a<du) du=a; }
      for(const t of tDowns){ const b=dist(w,t); if(b<dd) dd=b; }
    }
  }
  return [du,dd];
}

// closest match to any one stored frame, over every allowed shift (rep mode)
function bestOne(g,tpls){
  let best=Infinity;
  for(let dy=-SHIFT;dy<=SHIFT;dy++){
    for(let dx=-SHIFT;dx<=SHIFT;dx++){
      const w=windowAt(g,dx,dy);
      for(const t of tpls){ const d=dist(w,t); if(d<best) best=d; }
    }
  }
  return best;
}

// HOLD mode: no shifting. In a plank you're meant to be still, so sliding the
// window to find a match would forgive exactly the sagging we want to catch.
// And we score the WORST-changed fifth of the frame, not the average — knees
// hitting the floor is a big change in a small area, which an average erases.
const TOPK=Math.max(4,Math.round(N*.2));
function distTop(a,b){
  const d=new Float32Array(N);
  for(let i=0;i<N;i++){ const x=a[i]-b[i]; d[i]=x*x; }
  d.sort();                                  // ascending
  let s=0; for(let i=N-TOPK;i<N;i++) s+=d[i];
  return s/TOPK;
}
function driftNow(g,tpls){
  const w=windowAt(g,0,0);
  let best=Infinity;
  for(const t of tpls){ const d=distTop(w,t); if(d<best) best=d; }
  return best;
}

// grab BURST_N frames over ~0.7s, then keep KEEP of them:
// the most typical frame plus the ones furthest from it, so normal AND sloppy reps match
function selectFrames(frames){
  if(frames.length<=KEEP) return frames;
  const mean=frames.map(f=>{
    let s=0; for(const o of frames) s+=dist(f,o);
    return s/frames.length;
  });
  // drop the two least typical — usually motion blur or a mid-move frame
  const ranked=frames.map((f,i)=>({f,m:mean[i]})).sort((a,b)=>a.m-b.m).slice(0,frames.length-2);
  const medoid=ranked[0].f;
  const rest=ranked.slice(1).sort((a,b)=>dist(b.f,medoid)-dist(a.f,medoid));
  return [medoid, ...rest.slice(0,KEEP-1).map(r=>r.f)];
}

function captureBurst(done){
  const frames=[];
  let n=0;
  const t=setInterval(()=>{
    const g=grab();
    if(g) frames.push(windowAt(g,0,0));
    if(++n>=BURST_N){ clearInterval(t); done(selectFrames(frames)); }
  },BURST_MS);
}
function dist(a,b){let s=0;for(let i=0;i<N;i++){const d=a[i]-b[i];s+=d*d;}return s/N;}

let audio;
function beep(f,ms){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();
    o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audio.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+ms/1000);
    o.start(); o.stop(audio.currentTime+ms/1000);
  }catch(e){}
}

btnStart.onclick=async()=>{
  btnStart.disabled=true; elState.textContent='Starting…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}},audio:false});
    v.srcObject=stream; await v.play();
    running=true;
    document.getElementById('row1').style.display='none';
    document.getElementById('row2').style.display='flex';
    document.getElementById('row3').style.display='flex';
    applyPanel();
    if(mode==='hold'){
      elState.textContent = tplHold.length ? 'Ready' : 'Needs position';
      elHint.textContent='Tap “Set position” while holding the position you want to track.';
    }else{
      elState.textContent='Needs calibration';
      elHint.textContent='Step 1: hold the top of a push-up and tap “Capture up position”.';
    }
    beep(660,90);
    loop();
  }catch(e){
    btnStart.disabled=false; elState.textContent='No camera';
    elHint.textContent='Camera access was blocked. Allow it in your browser settings, then tap Start camera again.';
  }
};

function countdownCapture(which){
  if(busy) return; busy=true;
  cd.classList.add('on');
  cdtxt.textContent = which==='up' ? 'Get to the top and hold' : 'Get your face 3 inches from the camera and hold';
  let n=3; cdnum.textContent=n; beep(520,80);
  const t=setInterval(()=>{
    n--;
    if(n>0){cdnum.textContent=n; beep(520,80);}
    else{
      clearInterval(t); beep(880,160);
      cdnum.textContent='•'; cdtxt.textContent='Hold — sampling';
      captureBurst(frames=>{
        cd.classList.remove('on');
        if(frames.length){
          if(which==='up'){
            tplUps=frames;
            btnUp.classList.add('done'); btnUp.textContent='Up position set';
          }else{
            tplDowns.push(...frames); downCaptures++;
            while(downCaptures>MAX_DOWNS){ tplDowns.splice(0,KEEP); downCaptures--; }
            btnDown.classList.add('done');
            btnDown.textContent = downCaptures===1 ? 'Down position set'
                                                   : `Down positions (${downCaptures})`;
          }
        }
        if(tplUps.length&&tplDowns.length){
          elState.textContent='Counting'; phase='up';
          elHint.textContent = downCaptures===1
            ? 'Go. For one-leg moves, capture the down position again on the other side.'
            : 'Go. A rep lands when you come back up.';
        }else{
          elHint.textContent = tplUps.length ? 'Step 2: tap “Capture down position”, then get your face right up to the camera.'
                                             : 'Step 1: hold the top of a push-up and tap “Capture up position”.';
        }
        busy=false;
      });
    }
  },1000);
}
btnUp.onclick=()=>countdownCapture('up');
btnDown.onclick=()=>countdownCapture('down');

// ── reset dropdown ──
const resetMenuBtn=document.getElementById('resetMenuBtn'), resetMenu=document.getElementById('resetMenu');
const optUp=document.getElementById('resetUpOpt'), optDown=document.getElementById('resetDownOpt'),
      optCount=document.getElementById('resetCountOpt');

function calibrationState(){
  if(tplUps.length&&tplDowns.length){ elState.textContent='Counting'; }
  else{
    elState.textContent='Needs calibration';
    elHint.textContent = tplUps.length ? 'Down position cleared — capture it again.'
             : tplDowns.length ? 'Up position cleared — capture it again.'
                               : 'Capture the up and down positions to start counting.';
  }
  phase='up'; hold=0;
}

resetMenuBtn.onclick=(e)=>{
  e.stopPropagation();
  // labels reflect what's actually stored right now
  optDown.textContent = downCaptures>1 ? `Reset down positions (${downCaptures})` : 'Reset down position';
  optUp.disabled = tplUps.length===0;
  optDown.disabled = tplDowns.length===0;
  optCount.disabled = count===0;
  resetMenu.classList.toggle('on');
};
document.addEventListener('click',()=>resetMenu.classList.remove('on'));

optUp.onclick=(e)=>{e.stopPropagation(); resetMenu.classList.remove('on');
  tplUps=[];
  btnUp.classList.remove('done'); btnUp.textContent='Capture up position';
  calibrationState();
};
optDown.onclick=(e)=>{e.stopPropagation(); resetMenu.classList.remove('on');
  tplDowns=[]; downCaptures=0;
  btnDown.classList.remove('done'); btnDown.textContent='Capture down position';
  calibrationState();
};
optCount.onclick=(e)=>{e.stopPropagation(); resetMenu.classList.remove('on');
  count=0; elCount.textContent='0'; phase='up';
};

// ── hold-position mode ────────────────────────────────────
const rowHold=document.getElementById('rowHold'),
      btnHoldSet=document.getElementById('holdSet'),
      btnHoldStart=document.getElementById('holdStart');

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}

async function ensurePose(){
  if(poseDetector||poseLoading) return;
  poseLoading=true;
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js');
    poseDetector=await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      {modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
    // first inference compiles shaders and can block for seconds — do it now,
    // in the background, instead of mid-capture where it freezes the countdown
    try{ if(v.readyState>=2) await poseDetector.estimatePoses(v); }catch(e){}
    console.log('Pose tracking ready');
  }catch(e){ console.warn('Pose model unavailable — falling back to pixel matching', e); }
  poseLoading=false;
}

// average several pose readings into a reference skeleton
async function samplePoseRef(){
  if(!poseDetector) return;
  const samples=[];
  for(let i=0;i<6;i++){
    try{ const p=await poseDetector.estimatePoses(v); if(p[0]) samples.push(p[0].keypoints); }catch(e){}
    await new Promise(r=>setTimeout(r,120));
  }
  if(!samples.length) return;
  const K=samples[0].length, ref=[];
  for(let k=0;k<K;k++){
    let sx=0,sy=0,ss=0,n=0;
    for(const s of samples){ const kp=s[k]; if(kp.score>=.3){sx+=kp.x;sy+=kp.y;ss+=kp.score;n++;} }
    ref.push(n ? {x:sx/n,y:sy/n,score:ss/n} : {x:0,y:0,score:0});
  }
  const conf=ref.filter(k=>k.score>=.3);
  if(conf.length<5) return;   // can't see enough of the body from here
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const k of conf){
    if(k.x<minx)minx=k.x; if(k.x>maxx)maxx=k.x;
    if(k.y<miny)miny=k.y; if(k.y>maxy)maxy=k.y;
  }
  poseScale=Math.max(50,Math.hypot(maxx-minx,maxy-miny));  // body size in px
  poseRef=ref;
}

// how far out of position you are: the average of your THREE most-moved joints,
// as a fraction of body size. Averaging all joints let knees-on-the-floor hide
// behind a still head and shoulders — the same dilution bug the pixels had.
const KP_NAMES=['nose','l-eye','r-eye','l-ear','r-ear','l-shoulder','r-shoulder','l-elbow','r-elbow',
                'l-wrist','r-wrist','l-hip','r-hip','l-knee','r-knee','l-ankle','r-ankle'];
let lastTopJoints='';
function poseDisplacement(kps){
  if(!poseRef) return null;
  const moved=[];
  for(let i=0;i<kps.length;i++){
    const a=kps[i], b=poseRef[i];
    if(a.score>=.3 && b.score>=.3) moved.push({d:Math.hypot(a.x-b.x,a.y-b.y), i});
  }
  if(moved.length<5) return null;   // lost sight of the body
  moved.sort((x,y)=>y.d-x.d);
  const k=Math.min(3,moved.length);
  let s=0; for(let i=0;i<k;i++) s+=moved[i].d;
  lastTopJoints = moved.slice(0,k).map(m=>`${KP_NAMES[m.i]} ${(m.d/poseScale).toFixed(2)}`).join(', ');
  drawPose(kps);
  return (s/k)/poseScale;
}

// skeleton overlay: green = tracked confidently, red = the model is guessing
const dbg=document.getElementById('poseDebug'), dbgCtx=dbg.getContext('2d');
function drawPose(kps){
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh) return;
  if(dbg.width!==dbg.clientWidth){ dbg.width=dbg.clientWidth; dbg.height=dbg.clientHeight; }
  // object-fit:cover mapping from video coords to screen
  const scale=Math.max(dbg.width/vw, dbg.height/vh);
  const ox=(dbg.width-vw*scale)/2, oy=(dbg.height-vh*scale)/2;
  dbgCtx.clearRect(0,0,dbg.width,dbg.height);
  for(let i=0;i<kps.length;i++){
    const k=kps[i];
    const x=k.x*scale+ox, y=k.y*scale+oy;
    dbgCtx.beginPath();
    dbgCtx.arc(x,y,6,0,Math.PI*2);
    dbgCtx.fillStyle = k.score>=.3 ? 'rgba(63,217,168,.9)' : 'rgba(255,80,80,.9)';
    dbgCtx.fill();
  }
}
function clearPoseDebug(){ dbgCtx&&dbgCtx.clearRect(0,0,dbg.width,dbg.height); }

const MAX_HOLD_MS=30*60*1000;   // hard stop so a forgotten timer can't run forever
const fmt=ms=>{
  const t=Math.max(0,ms)/1000;
  const m=Math.floor(t/60), s=t-m*60;
  // tenths only under a minute — past that they're noise and the text gets too wide
  return m>0 ? `${m}:${Math.floor(s).toString().padStart(2,'0')}` : s.toFixed(1);
};

// how far you may drift from the captured position before it counts as failing
// holdRef is your ACTUAL steady-state drift, averaged over the grace window
function breakAt(){
  const tol = 1.2 + ((armAt-.38)/.37)*1.8;   // sensitivity slider scales it (1.2x - 3.0x)
  if(poseRef) return Math.min(.6, Math.max(.05, (holdRef||0)*tol + .04));  // joint units
  return Math.min(4.0, Math.max(.14, (holdRef||holdBase)*tol + .05));     // pixel units
}

function applyPanel(){
  if(!running) return;
  const holdMode = mode==='hold';
  row2.style.display  = (holdMode||paused) ? 'none' : 'flex';
  row3.style.display  = (holdMode||paused) ? 'none' : 'flex';
  rowHold.style.display = (holdMode && !holdRunning) ? 'flex' : 'none';
  rowPaused.style.display = (!holdMode && paused) ? 'flex' : 'none';
  elHint.style.display = holdRunning ? 'none' : '';
  elCount.classList.toggle('timer', holdMode);
  elCountLabel.textContent = holdMode ? 'hold time' : 'reps';
}

btnHoldSet.onclick=()=>{
  if(busy) return; busy=true;
  ensurePose();
  cd.classList.add('on'); cdtxt.textContent='Get into the position and hold';
  let n=3; cdnum.textContent=n; beep(520,80);
  const t=setInterval(()=>{
    n--;
    if(n>0){cdnum.textContent=n; beep(520,80);}
    else{
      clearInterval(t); beep(880,160);
      cdnum.textContent='•'; cdtxt.textContent='Hold — sampling';
      poseRef=null; poseDrift=null;
      captureBurst(frames=>{
        // pose sampling happens AFTER the burst — running them together
        // stalled the timers whenever the model had work to do
        samplePoseRef();
        cd.classList.remove('on');
        if(frames.length){
          tplHold=frames;
          // typical wobble while holding still — the baseline a break is measured against
          let b=0; for(const f of frames) b=Math.max(b,dist(f,frames[0]));
          holdBase=b;
          btnHoldSet.classList.add('done'); btnHoldSet.textContent='Position set';
          elState.textContent='Ready';
          elHint.textContent='Tap Start, then get back into position — the clock begins after the countdown.';
        }
        busy=false;
      });
    }
  },1000);
};

btnHoldStart.onclick=()=>{
  if(busy||!tplHold.length){
    if(!tplHold.length) elHint.textContent='Set the position first.';
    return;
  }
  busy=true;
  cd.classList.add('on'); cdtxt.textContent='Get into position';
  let n=3; cdnum.textContent=n; beep(520,80);
  const t=setInterval(()=>{
    n--;
    if(n>0){cdnum.textContent=n; beep(520,80);}
    else{
      clearInterval(t); cd.classList.remove('on'); beep(880,160);
      busy=false;
      holdRunning=true; holdT0=performance.now(); holdBreak=0;
      graceSum=0; graceN=0; holdRef=0;
      elState.textContent='Holding';
      applyPanel();
    }
  },1000);
};

function endHold(){
  const ms=performance.now()-holdT0;
  holdRunning=false; holdBreak=0;
  elCount.textContent=fmt(ms);
  elState.textContent='Done';
  beep(300,400);
  applyPanel();
  elHint.textContent=`Held ${fmt(ms)}. Tap Start to go again.`;
  if(window.onHoldEnd) window.onHoldEnd(ms);
}

// countdown shown while the body tracker loads — dismisses early once it's ready
let prepActive=false;
function prepOverlay(){
  if(prepActive||poseDetector) return;
  prepActive=true;
  cd.classList.add('on'); cdtxt.textContent='Preparing workout';
  let n=5; cdnum.textContent=n;
  const t=setInterval(()=>{
    if(poseDetector||mode!=='hold'){ clearInterval(t); cd.classList.remove('on'); prepActive=false; beep(880,120); return; }
    n--;
    if(n<=0){ clearInterval(t); cd.classList.remove('on'); prepActive=false; }
    else cdnum.textContent=n;
  },1000);
}

window.setMode=(t)=>{
  mode = t==='hold' ? 'hold' : 'reps';
  holdRunning=false; tplHold=[]; holdBase=0; holdBreak=0;
  poseRef=null; poseDrift=null;
  clearPoseDebug();
  if(mode==='hold'){ ensurePose(); prepOverlay(); }   // fetch the tracker, show the countdown while it loads
  btnHoldSet.classList.remove('done'); btnHoldSet.textContent='Set position';
  elCount.textContent = mode==='hold' ? '0.0' : '0';
  if(running){
    elState.textContent = mode==='hold' ? 'Needs position' : 'Needs calibration';
    elHint.textContent = mode==='hold'
      ? 'Tap “Set position” while holding the position you want to track.'
      : 'Capture the up and down positions to start counting.';
  }
  applyPanel();
};
// ──────────────────────────────────────────────────────────

document.getElementById('resetAll').onclick=()=>{
  count=0; elCount.textContent='0';
  window.clearCalibration();
};

// ── pause: camera stays on, counting stops ──
document.getElementById('pause').onclick=()=>{
  paused=true; phase='up'; hold=0;   // a half-finished rep dies here, not on resume
  row2.style.display='none'; row3.style.display='none'; elHint.style.display='none';
  rowPaused.style.display='flex';
  elState.textContent='Paused';
  elFill.style.width='0%';
  elRing.style.boxShadow='inset 0 0 0 4px rgba(234,242,240,.15)';
};
document.getElementById('unpause').onclick=()=>{
  paused=false;
  rowPaused.style.display='none';
  row2.style.display='flex'; row3.style.display='flex'; elHint.style.display='';
  elState.textContent = (tplUps.length&&tplDowns.length) ? 'Counting' : 'Needs calibration';
};

// hooks for the Firebase module below
window.getCount=()=>count;
window.zeroCount=()=>{count=0; elCount.textContent='0'; phase='up';};
window.clearCalibration=(msg)=>{
  tplUps=[]; tplDowns=[]; downCaptures=0; phase='up'; hold=0; lastPeak=0;
  btnUp.classList.remove('done'); btnUp.textContent='Capture up position';
  btnDown.classList.remove('done'); btnDown.textContent='Capture down position';
  if(running){
    elState.textContent='Needs calibration';
    elHint.textContent = msg || 'Fresh start — capture the up and down positions again.';
  }
};

function loop(){
  if(!running) return;
  requestAnimationFrame(loop);
  if(busy||paused) return;
  const f=grab(); if(!f) return;

  let score=0;
  if(mode==='hold'){
    if(tplHold.length){
      let d;
      if(poseRef&&poseDetector){
        // keep one estimate in flight; use the latest completed reading
        if(!estimating){
          estimating=true;
          poseDetector.estimatePoses(v)
            .then(p=>{ estimating=false; poseDrift = p[0] ? poseDisplacement(p[0].keypoints) : null; })
            .catch(()=>{ estimating=false; });
        }
        // losing sight of the body entirely counts as way out of position
        d = (poseDrift==null) ? breakAt()*3 : poseDrift;
      }else{
        d = driftNow(f,tplHold);
      }
      lastDrift=d;
      if(holdRunning){
        const elapsed=performance.now()-holdT0;
        elCount.textContent=fmt(elapsed);
        if(elapsed>=MAX_HOLD_MS){ endHold(); return; }
        if(elapsed<=GRACE_MS){
          // learn what "holding steady" actually reads like, right now
          if(!(poseRef&&poseDrift==null)){ graceSum+=d; graceN++; holdRef=graceN?graceSum/graceN:0; }
        }else{
          const th=breakAt();
          holdBreak = d>th ? holdBreak+1 : 0;
          // way past the line = you've clearly dropped; don't wait the full window
          if(holdBreak>=BREAK_FRAMES || (d>th*2 && holdBreak>=HARD_FRAMES)){ endHold(); return; }
        }
      }
      // meter shows how solid the hold is: full = dead on, empty = about to fail
      score = 1 - Math.min(1, d/breakAt());
    }
    const p=Math.max(0,Math.min(1,score));
    elFill.style.width=(p*100).toFixed(1)+'%';
    elFill.style.background = holdRunning ? 'var(--down)' : 'var(--signal)';
    const rw=4+p*34, rc = holdRunning ? '63,217,168' : '255,176,32';
    elRing.style.boxShadow=`inset 0 0 0 ${rw.toFixed(1)}px rgba(${rc},${(.25+p*.45).toFixed(2)})`;
    elReadout.textContent =
      `drift ${lastDrift.toFixed(2)}  ·  breaks at ${breakAt().toFixed(2)}` +
      (poseRef ? `  ·  moving: ${lastTopJoints||'—'}` : '  ·  PIXEL FALLBACK');
    elSensValue.textContent = `Sensitivity ${elSens.value}`;
    return;
  }

  if(tplUps.length&&tplDowns.length){
    const [du,dd]=bestPair(f,tplUps,tplDowns);
    score=du/(du+dd||1);
    const now=performance.now();

    if(phase==='up'){
      // must stay past the trigger a few frames — a head twitch won't do it
      hold = score>armAt ? hold+1 : 0;
      if(hold>=HOLD && now-lastFlip>DEBOUNCE){ phase='down'; peak=score; hold=0; lastFlip=now; beep(340,60); }
    }else{
      if(score>peak) peak=score;          // track the deepest point YOU reached
      // rep ends when you've come back up meaningfully from that point
      if(score < peak-RELEASE && score < armAt && now-lastFlip>DEBOUNCE){
        phase='up'; hold=0; lastFlip=now; lastPeak=peak; count++;
        elCount.textContent=count;
        elCount.classList.remove('pop'); void elCount.offsetWidth; elCount.classList.add('pop');
        beep(900,130);
      }
    }
  }
  const pct=Math.max(0,Math.min(1,score));
  elFill.style.width=(pct*100).toFixed(1)+'%';
  elFill.style.background = phase==='down' ? 'var(--down)' : 'var(--signal)';
  const w=4+pct*34, col = phase==='down' ? '63,217,168' : '255,176,32';
  elRing.style.boxShadow=`inset 0 0 0 ${w.toFixed(1)}px rgba(${col},${(.25+pct*.45).toFixed(2)})`;
  lastScore=pct;
  paintReadout();
}
</script>

    workoutLabel.textContent = active.name;
    if(window.setMode) window.setMode(active.type);
    renderWorkouts();
    loadToday();
  }
  // ─────────────────────────────────────────────────────────────

  signInAnonymously(auth).catch(e => console.warn('Sign-in failed', e));
  onAuthStateChanged(auth, user => {
    if(!user) return;
    uid = user.uid;
    btnSave.style.display = '';
    loadWorkouts();
  });

  btnSave.onclick = () => {
    const reps = window.getCount();
    if(!uid || reps === 0) return;

    // screen updates now; the write finishes in the background
    todayReps += reps;
    paintToday();
    window.zeroCount();
    btnSave.textContent = 'Saved';
    setTimeout(() => { btnSave.textContent = 'Save set'; }, 1200);

    setDoc(todayRef(), { reps: increment(reps), updated: Date.now() }, { merge: true })
      .catch(e => {
        console.warn('Save failed', e);
        todayReps -= reps;
        paintToday();
        btnSave.textContent = 'Save failed';
      });
  };
}
</script>
</body>
</html>
